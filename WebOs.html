<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 WebOS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI"', 'Inter', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                    colors: {
                        winAccent: 'var(--win-accent)',
                        winAccentHover: 'var(--win-accent-hover)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --win-accent: #0078d4;
            --win-accent-hover: #106ebe;
            --win-glass-bg: rgba(20, 25, 35, 0.75);
            --win-glass-light: rgba(255, 255, 255, 0.75);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Windows 11 Glassmorphism & Effects */
        .win-mica {
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
        }
        
        .win-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 0, 0, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 150, 150, 0.5);
        }

        /* Animations */
        @keyframes startMenuOpen {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-start-open {
            animation: startMenuOpen 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes windowOpen {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .animate-window-open {
            animation: windowOpen 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        /* Selection box styling */
        #selection-box {
            position: absolute;
            background: rgba(0, 120, 212, 0.25);
            border: 1px solid rgba(0, 120, 212, 0.8);
            pointer-events: none;
            z-index: 5;
        }

        .snap-preview {
            transition: all 0.15s ease-out;
            border: 2px solid var(--win-accent);
            background: rgba(0, 120, 212, 0.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 dark" id="app-root">

    <!-- ========================================== -->
    <!-- BOOT / LOCK / LOGIN SCREEN OVERLAY -->
    <!-- ========================================== -->
    <div id="boot-overlay" class="fixed inset-0 z-[99999] bg-black flex flex-col items-center justify-center text-white transition-opacity duration-700">
        <div id="boot-spinner" class="flex flex-col items-center space-y-6">
            <div class="w-16 h-16 relative flex items-center justify-center">
                <!-- Win 11 Logo -->
                <div class="grid grid-cols-2 gap-1 w-12 h-12">
                    <div class="bg-sky-500 rounded-sm"></div>
                    <div class="bg-sky-500 rounded-sm"></div>
                    <div class="bg-sky-500 rounded-sm"></div>
                    <div class="bg-sky-500 rounded-sm"></div>
                </div>
            </div>
            <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs font-medium text-slate-400 tracking-wider">Starting Windows...</p>
        </div>
    </div>

    <!-- LOCK SCREEN -->
    <div id="lock-screen" class="fixed inset-0 z-[9999] bg-cover bg-center transition-all duration-500 flex flex-col justify-between p-12 text-white" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2560&auto=format&fit=crop');">
        <!-- Lock Screen Top Clock -->
        <div class="flex flex-col items-center mt-12 cursor-pointer" onclick="unlockScreen()">
            <div id="lock-time" class="text-7xl font-light tracking-tight drop-shadow-lg">12:00</div>
            <div id="lock-date" class="text-xl font-medium mt-2 drop-shadow-md">Thursday, November 5</div>
        </div>

        <!-- Login Prompt (hidden by default) -->
        <div id="login-card" class="hidden flex-col items-center self-center bg-slate-900/60 win-mica p-8 rounded-3xl border border-white/10 w-80 text-center shadow-2xl animate-window-open">
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-3xl font-bold shadow-lg mb-3">
                <i class="fa-solid fa-user"></i>
            </div>
            <h3 class="font-semibold text-lg">Administrator</h3>
            <p class="text-xs text-slate-300 mb-4">admin@win11.webos</p>
            <form onsubmit="handleLogin(event)" class="w-full space-y-3">
                <div class="relative">
                    <input id="login-password" type="password" placeholder="PIN / Password (press Enter)" class="w-full bg-slate-950/70 border border-white/20 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-sky-500 pr-10">
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white px-2 py-1">
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
                <p class="text-[11px] text-slate-400">Click arrow or press Enter to sign in</p>
            </form>
        </div>

        <!-- Bottom Unlock Hint -->
        <div id="lock-hint" class="text-center text-sm font-medium tracking-wide text-slate-200 animate-pulse cursor-pointer" onclick="showLoginCard()">
            <i class="fa-solid fa-lock text-xs mr-2"></i>Click or press any key to sign in
        </div>
    </div>

    <!-- ========================================== -->
    <!-- DESKTOP CONTAINER -->
    <!-- ========================================== -->
    <div id="desktop-wallpaper" class="fixed inset-0 bg-cover bg-center transition-all duration-500 flex flex-col justify-between" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2560&auto=format&fit=crop');">
        
        <!-- Desktop Icons Grid -->
        <div id="desktop-grid" class="flex-1 p-4 grid grid-flow-col auto-cols-[96px] grid-rows-[repeat(auto-fill,96px)] gap-2 z-10 select-none">
            <!-- Dynamic Desktop Icons loaded via JavaScript -->
        </div>

        <!-- Snap Layout Ghost Overlay -->
        <div id="snap-preview-ghost" class="fixed hidden z-40 rounded-xl snap-preview pointer-events-none"></div>

        <!-- Context Menu -->
        <div id="context-menu" class="fixed hidden z-[9000] w-56 bg-slate-900/90 win-mica border border-white/10 rounded-2xl shadow-2xl text-xs py-1.5 text-slate-200">
            <!-- Dynamic items generated in JS -->
        </div>

        <!-- Active Windows Area -->
        <div id="windows-workspace" class="fixed inset-0 pointer-events-none z-20 pb-12 overflow-hidden"></div>

        <!-- ========================================== -->
        <!-- START MENU & SEARCH POPUPS -->
        <!-- ========================================== -->
        
        <!-- START MENU -->
        <div id="start-menu" class="fixed bottom-16 left-1/2 -translate-x-1/2 w-[540px] max-w-[95vw] h-[600px] bg-slate-900/85 dark:bg-slate-900/90 win-mica border border-white/10 rounded-3xl shadow-2xl z-[8000] hidden flex-col p-6 text-white animate-start-open">
            <!-- Search bar in start -->
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input id="start-search-input" oninput="filterStartMenuApps(this.value)" type="text" placeholder="Type here to search apps, settings, and files..." class="w-full bg-slate-950/50 border border-white/10 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-sky-500/80">
            </div>

            <!-- Pinned Section Header -->
            <div class="flex justify-between items-center mb-3 px-2">
                <span class="text-xs font-semibold text-slate-200">Pinned</span>
                <button onclick="showNotification('Start Menu', 'Showing all pinned apps')" class="text-[11px] bg-white/5 hover:bg-white/10 px-2.5 py-1 rounded-lg text-slate-200 transition">All apps &gt;</button>
            </div>

            <!-- Apps Grid -->
            <div id="start-apps-grid" class="grid grid-cols-4 gap-3 mb-6 overflow-y-auto max-h-[320px] p-1">
                <!-- App items populated by JS -->
            </div>

            <!-- Recommended Section -->
            <div class="flex justify-between items-center mb-2 px-2 mt-auto">
                <span class="text-xs font-semibold text-slate-200">Recommended</span>
                <span class="text-[11px] text-slate-400">More</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 mb-4 px-2">
                <div onclick="openApp('notepad'); toggleStartMenu()" class="flex items-center space-x-3 p-2.5 rounded-xl hover:bg-white/10 cursor-pointer transition border border-white/5">
                    <i class="fa-solid fa-file-lines text-sky-400 text-lg"></i>
                    <div>
                        <p class="font-medium text-slate-200">Project_Notes.txt</p>
                        <p class="text-[10px] text-slate-400">Recently opened</p>
                    </div>
                </div>
                <div onclick="openApp('explorer'); toggleStartMenu()" class="flex items-center space-x-3 p-2.5 rounded-xl hover:bg-white/10 cursor-pointer transition border border-white/5">
                    <i class="fa-solid fa-folder text-amber-400 text-lg"></i>
                    <div>
                        <p class="font-medium text-slate-200">Downloads</p>
                        <p class="text-[10px] text-slate-400">Folder</p>
                    </div>
                </div>
            </div>

            <!-- User Footer Bar -->
            <div class="pt-4 border-t border-white/10 flex justify-between items-center px-2">
                <div class="flex items-center space-x-3 cursor-pointer hover:bg-white/5 p-1.5 rounded-xl transition">
                    <div class="w-8 h-8 rounded-full bg-sky-600 flex items-center justify-center font-bold text-xs">A</div>
                    <span class="text-xs font-medium">Administrator</span>
                </div>
                <div class="relative">
                    <button onclick="togglePowerMenu()" class="w-9 h-9 rounded-xl hover:bg-white/10 flex items-center justify-center text-slate-300 transition">
                        <i class="fa-solid fa-power-off text-sm"></i>
                    </button>
                    <!-- Power Popup -->
                    <div id="power-menu" class="hidden absolute bottom-12 right-0 w-36 bg-slate-800 border border-white/10 rounded-xl shadow-2xl py-1 text-xs z-50">
                        <button onclick="lockSystem()" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center space-x-2"><i class="fa-solid fa-lock text-slate-400"></i><span>Lock</span></button>
                        <button onclick="rebootSystem()" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center space-x-2"><i class="fa-solid fa-rotate-right text-amber-400"></i><span>Restart</span></button>
                        <button onclick="shutdownSystem()" class="w-full text-left px-3 py-2 hover:bg-rose-500/20 text-rose-400 flex items-center space-x-2"><i class="fa-solid fa-power-off"></i><span>Shut Down</span></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- QUICK SETTINGS & NOTIFICATION CENTER PANEL -->
        <div id="quick-settings-panel" class="fixed bottom-16 right-3 w-80 bg-slate-900/90 win-mica border border-white/10 rounded-3xl shadow-2xl z-[8000] hidden flex-col p-4 text-white animate-start-open">
            <div class="grid grid-cols-3 gap-3 mb-4">
                <button onclick="toggleSettingTile(this, 'wifi')" class="tile-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-sky-600 text-white transition">
                    <i class="fa-solid fa-wifi text-base mb-1"></i>
                    <span class="text-[11px] font-medium">Wi-Fi</span>
                </button>
                <button onclick="toggleSettingTile(this, 'bluetooth')" class="tile-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                    <i class="fa-solid fa-bluetooth text-base mb-1"></i>
                    <span class="text-[11px] font-medium">Bluetooth</span>
                </button>
                <button onclick="toggleDarkMode()" class="tile-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-sky-600 text-white transition">
                    <i class="fa-solid fa-moon text-base mb-1"></i>
                    <span class="text-[11px] font-medium">Dark Mode</span>
                </button>
                <button onclick="toggleSettingTile(this, 'dnd')" class="tile-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                    <i class="fa-solid fa-bell-slash text-base mb-1"></i>
                    <span class="text-[11px] font-medium">Focus</span>
                </button>
                <button onclick="toggleSettingTile(this, 'nightlight')" class="tile-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                    <i class="fa-solid fa-eye text-base mb-1"></i>
                    <span class="text-[11px] font-medium">Night Light</span>
                </button>
                <button onclick="openApp('settings'); toggleQuickSettings();" class="tile-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                    <i class="fa-solid fa-gear text-base mb-1"></i>
                    <span class="text-[11px] font-medium">Settings</span>
                </button>
            </div>

            <!-- Volume Slider -->
            <div class="space-y-3 pt-2 border-t border-white/10">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
                    <input id="volume-range" type="range" min="0" max="100" value="75" class="w-full accent-sky-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer" oninput="updateVolume(this.value)">
                </div>
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-sun text-slate-400 text-sm"></i>
                    <input type="range" min="20" max="100" value="100" class="w-full accent-sky-500 h-1.5 bg-slate-700 rounded-lg cursor-pointer" oninput="document.getElementById('app-root').style.filter = `brightness(${this.value}%)`">
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- WINDOWS 11 CENTERED TASKBAR -->
        <!-- ========================================== -->
        <div id="taskbar" class="fixed bottom-0 left-0 right-0 h-12 bg-slate-950/80 win-mica border-t border-white/10 z-[7000] flex items-center justify-between px-3 select-none">
            <!-- Left Empty Space / Widgets -->
            <div class="w-32 flex items-center space-x-2">
                <button class="flex items-center space-x-2 px-2.5 py-1 rounded-xl hover:bg-white/10 transition text-slate-300 text-xs">
                    <i class="fa-solid fa-cloud-sun text-amber-400 text-sm"></i>
                    <span class="hidden sm:inline font-medium">72°F Sunny</span>
                </button>
            </div>

            <!-- Center Taskbar Icons -->
            <div id="taskbar-center" class="flex items-center space-x-1.5 bg-slate-900/40 px-2 py-1 rounded-2xl border border-white/5 shadow-inner">
                <!-- Windows Start Icon -->
                <button onclick="toggleStartMenu()" id="start-btn" class="w-9 h-9 rounded-xl hover:bg-white/10 flex items-center justify-center transition active:scale-90">
                    <div class="grid grid-cols-2 gap-0.5 w-4 h-4">
                        <div class="bg-sky-400 rounded-[1px]"></div>
                        <div class="bg-sky-400 rounded-[1px]"></div>
                        <div class="bg-sky-400 rounded-[1px]"></div>
                        <div class="bg-sky-400 rounded-[1px]"></div>
                    </div>
                </button>

                <!-- Search Icon -->
                <button onclick="toggleStartMenu(); setTimeout(()=>document.getElementById('start-search-input').focus(), 50);" class="w-9 h-9 rounded-xl hover:bg-white/10 flex items-center justify-center text-slate-300 transition active:scale-90">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>

                <div class="w-[1px] h-5 bg-white/10 mx-1"></div>

                <!-- Dynamic Pinned/Running App Taskbar Icons populated in JS -->
                <div id="taskbar-pinned-apps" class="flex items-center space-x-1"></div>
            </div>

            <!-- Right System Tray -->
            <div class="w-44 flex items-center justify-end space-x-1">
                <button onclick="toggleQuickSettings()" class="flex items-center space-x-2 px-2 py-1 rounded-xl hover:bg-white/10 text-slate-300 text-xs transition">
                    <i class="fa-solid fa-wifi"></i>
                    <i id="tray-volume-icon" class="fa-solid fa-volume-high"></i>
                    <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
                </button>
                <div onclick="toggleQuickSettings()" class="flex flex-col items-end px-2 py-1 rounded-xl hover:bg-white/10 text-slate-200 cursor-pointer transition">
                    <span id="tray-time" class="text-[11px] font-semibold leading-tight">12:00 PM</span>
                    <span id="tray-date" class="text-[9px] text-slate-400 leading-tight">11/05/2026</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Notification Toasts Container -->
    <div id="notification-area" class="fixed bottom-14 right-4 z-[9990] flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Expose Firebase modules globally for app integration
        window.firebaseInit = async function() {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'webos-default-app';
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock", projectId: "mock" };
                
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                window.db = db;
                window.auth = auth;
                window.appId = appId;
                
                console.log("Database connected successfully!");
                showNotification("Cloud Storage", "Connected to cloud database successfully!");
                initCloudListeners();
            } catch (err) {
                console.log("Firebase init fallback:", err);
            }
        };
    </script>

    <!-- JavaScript System Engine -->
    <script>
        /* ==========================================================================
           SYSTEM GLOBAL STATE & DATA
           ========================================================================== */
        let state = {
            isLocked: true,
            wallpaper: localStorage.getItem('win11_wallpaper') || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2560&auto=format&fit=crop',
            accentColor: localStorage.getItem('win11_accent') || '#0078d4',
            volume: 75,
            activeApps: {},
            highestZ: 100,
            activeWindowId: null
        };

        const APPS_CONFIG = {
            explorer: { name: 'File Explorer', icon: 'fa-solid fa-folder text-amber-400', width: 'w-[780px]', height: 'h-[500px]' },
            settings: { name: 'Settings', icon: 'fa-solid fa-gear text-sky-400', width: 'w-[750px]', height: 'h-[520px]' },
            snake: { name: 'Retro Snake Pro', icon: 'fa-solid fa-gamepad text-emerald-400', width: 'w-[480px]', height: 'h-[540px]' },
            paint: { name: 'MS Paint Pro', icon: 'fa-solid fa-palette text-pink-400', width: 'w-[850px]', height: 'h-[580px]' },
            browser: { name: 'Edge Browser', icon: 'fa-solid fa-globe text-cyan-400', width: 'w-[900px]', height: 'h-[600px]' },
            terminal: { name: 'Terminal', icon: 'fa-solid fa-terminal text-emerald-500', width: 'w-[620px]', height: 'h-[400px]' },
            calculator: { name: 'Calculator', icon: 'fa-solid fa-calculator text-teal-400', width: 'w-[340px]', height: 'h-[460px]' },
            notepad: { name: 'Notepad', icon: 'fa-solid fa-file-lines text-sky-300', width: 'w-[560px]', height: 'h-[420px]' },
            spotify: { name: 'Spotify', icon: 'fa-brands fa-spotify text-emerald-500', width: 'w-[800px]', height: 'h-[520px]' },
            xbox: { name: 'Xbox', icon: 'fa-brands fa-xbox text-emerald-400', width: 'w-[840px]', height: 'h-[540px]' },
            weather: { name: 'Weather', icon: 'fa-solid fa-cloud-sun text-amber-400', width: 'w-[600px]', height: 'h-[420px]' },
            camera: { name: 'Camera', icon: 'fa-solid fa-camera text-sky-300', width: 'w-[640px]', height: 'h-[480px]' },
            store: { name: 'Microsoft Store', icon: 'fa-solid fa-bag-shopping text-blue-400', width: 'w-[820px]', height: 'h-[540px]' },
            photos: { name: 'Photos', icon: 'fa-solid fa-image text-purple-400', width: 'w-[780px]', height: 'h-[500px]' },
            mail: { name: 'Mail', icon: 'fa-solid fa-envelope text-red-400', width: 'w-[780px]', height: 'h-[500px]' },
            calendar: { name: 'Calendar', icon: 'fa-solid fa-calendar-days text-indigo-400', width: 'w-[720px]', height: 'h-[480px]' },
            word: { name: 'Word', icon: 'fa-solid fa-file-word text-blue-500', width: 'w-[800px]', height: 'h-[540px]' },
            excel: { name: 'Excel', icon: 'fa-solid fa-file-excel text-emerald-600', width: 'w-[800px]', height: 'h-[540px]' },
            powerpoint: { name: 'PowerPoint', icon: 'fa-solid fa-file-powerpoint text-orange-500', width: 'w-[800px]', height: 'h-[540px]' },
            todos: { name: 'To Do', icon: 'fa-solid fa-check-double text-sky-500', width: 'w-[600px]', height: 'h-[460px]' },
            discord: { name: 'Discord', icon: 'fa-brands fa-discord text-indigo-400', width: 'w-[860px]', height: 'h-[560px]' },
            scratch: { name: 'Scratch', icon: 'fa-solid fa-cat text-orange-400', width: 'w-[960px]', height: 'h-[620px]' }
        };

        /* ==========================================================================
           BOOT & UNLOCK LIFECYCLE
           ========================================================================== */
        window.addEventListener('load', () => {
            // Simulated System Boot
            setTimeout(() => {
                const bootOverlay = document.getElementById('boot-overlay');
                bootOverlay.style.opacity = '0';
                setTimeout(() => bootOverlay.style.display = 'none', 700);
            }, 1200);

            if (window.firebaseInit) window.firebaseInit();

            updateClocks();
            setInterval(updateClocks, 1000);
            renderDesktopIcons();
            renderStartApps();
            updateTaskbarApps();
            setupContextMenu();
        });

        function updateClocks() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const displayHours = hours % 12 || 12;

            const timeStr = `${displayHours}:${minutes} ${ampm}`;
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

        /* ==========================================================================
           WINDOW MANAGEMENT ENGINE
           ========================================================================== */
        function openApp(appId) {
            if (state.activeApps[appId]) {
                if (state.activeApps[appId].minimized) {
                    restoreWindow(appId);
                } else {
                    bringToFront(appId);
                }
                return;
            }

            const config = APPS_CONFIG[appId];
            if (!config) return;

            state.activeApps[appId] = { minimized: false, maximized: false };

            const win = document.createElement('div');
            win.id = `win-${appId}`;
            win.className = `absolute top-16 left-20 ${config.width} ${config.height} bg-slate-900/90 win-mica border border-white/10 rounded-2xl win-shadow flex flex-col pointer-events-auto overflow-hidden animate-window-open`;
            win.style.zIndex = ++state.highestZ;

            win.innerHTML = `
                <!-- Window Titlebar Header -->
                <div onmousedown="startWindowDrag(event, '${appId}')" class="h-10 bg-slate-950/60 border-b border-white/10 flex items-center justify-between px-3.5 select-none cursor-move">
                    <div class="flex items-center space-x-2.5 text-xs font-semibold text-slate-200">
                        <i class="${config.icon} text-sm"></i>
                        <span>${config.name}</span>
                    </div>
                    <!-- Win 11 Styled Window Control Buttons -->
                    <div class="flex items-center space-x-2" onmousedown="event.stopPropagation()">
                        <button onclick="minimizeWindow('${appId}')" title="Minimize" class="w-6 h-6 rounded-full bg-amber-500/80 hover:bg-amber-400 active:scale-90 flex items-center justify-center text-[10px] text-slate-950 font-bold transition shadow">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        <button onclick="toggleMaximizeWindow('${appId}')" title="Maximize / Restore" class="w-6 h-6 rounded-full bg-emerald-500/80 hover:bg-emerald-400 active:scale-90 flex items-center justify-center text-[10px] text-slate-950 font-bold transition shadow relative group">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                        <button onclick="closeApp('${appId}')" title="Close" class="w-6 h-6 rounded-full bg-rose-500/80 hover:bg-rose-400 active:scale-90 flex items-center justify-center text-[11px] text-slate-950 font-bold transition shadow">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <!-- App Body Content -->
                <div class="flex-1 overflow-hidden relative bg-slate-950/40">
                    ${getAppContent(appId)}
                </div>
            `;

            win.onmousedown = () => bringToFront(appId);
            document.getElementById('windows-workspace').appendChild(win);
            state.activeWindowId = appId;
            updateTaskbarApps();

            // Special initializers for apps needing runtime setup
            if (appId === 'snake') setTimeout(initSnakeApp, 100);
            if (appId === 'paint') setTimeout(initPaintApp, 100);
        }

        function bringToFront(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win) {
                win.style.zIndex = ++state.highestZ;
                state.activeWindowId = appId;
                updateTaskbarApps();
            }
        }

        function closeApp(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win) win.remove();
            delete state.activeApps[appId];
            updateTaskbarApps();
        }

        function minimizeWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win) {
                win.style.transform = 'scale(0.8) translateY(120px)';
                win.style.opacity = '0';
                setTimeout(() => win.style.display = 'none', 150);
                state.activeApps[appId].minimized = true;
                updateTaskbarApps();
            }
        }

        function restoreWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win) {
                win.style.display = 'flex';
                setTimeout(() => {
                    win.style.transform = 'scale(1) translateY(0)';
                    win.style.opacity = '1';
                }, 10);
                state.activeApps[appId].minimized = false;
                bringToFront(appId);
            }
        }

        function toggleMaximizeWindow(appId) {
            const win = document.getElementById(`win-${appId}`);
            const appState = state.activeApps[appId];
            if (!win) return;

            if (!appState.maximized) {
                win.dataset.prevStyle = win.style.cssText;
                win.style.top = '0px';
                win.style.left = '0px';
                win.style.width = '100vw';
                win.style.height = 'calc(100vh - 48px)';
                win.style.borderRadius = '0px';
                appState.maximized = true;
            } else {
                win.style.cssText = win.dataset.prevStyle;
                appState.maximized = false;
            }
            bringToFront(appId);
        }

        function updateTaskbarApps() {
            const container = document.getElementById('taskbar-pinned-apps');
            container.innerHTML = '';

            DESKTOP_ITEMS.forEach(app => {
                const isRunning = !!state.activeApps[app.id];
                const isActive = state.activeWindowId === app.id && isRunning && !state.activeApps[app.id].minimized;
                
                const btn = document.createElement('button');
                btn.className = `relative w-9 h-9 rounded-xl flex items-center justify-center transition active:scale-90 ${isActive ? 'bg-white/20' : 'hover:bg-white/10'}`;
                btn.onclick = () => {
                    if (isRunning) {
                        if (state.activeApps[app.id].minimized) restoreWindow(app.id);
                        else if (isActive) minimizeWindow(app.id);
                        else bringToFront(app.id);
                    } else {
                        openApp(app.id);
                    }
                };
                btn.innerHTML = `
                    <i class="${app.icon} text-base"></i>
                    ${isRunning ? `<div class="absolute bottom-1 w-1.5 h-1.5 rounded-full ${isActive ? 'bg-sky-400 w-3' : 'bg-slate-400'} transition-all"></div>` : ''}
                `;
                container.appendChild(btn);
            });
        }

        /* Window Dragging Engine */
        let windowDragState = { win: null, startX: 0, startY: 0, initLeft: 0, initTop: 0 };

        function startWindowDrag(e, appId) {
            if (state.activeApps[appId].maximized) return;
            const win = document.getElementById(`win-${appId}`);
            windowDragState = {
                win,
                startX: e.clientX,
                startY: e.clientY,
                initLeft: win.offsetLeft,
                initTop: win.offsetTop
            };
            bringToFront(appId);
            document.addEventListener('mousemove', onWindowDrag);
            document.addEventListener('mouseup', stopWindowDrag);
        }

        function onWindowDrag(e) {
            if (!windowDragState.win) return;
            const dx = e.clientX - windowDragState.startX;
            const dy = e.clientY - windowDragState.startY;
            windowDragState.win.style.left = `${windowDragState.initLeft + dx}px`;
            windowDragState.win.style.top = `${windowDragState.initTop + dy}px`;
        }

        function stopWindowDrag() {
            windowDragState.win = null;
            document.removeEventListener('mousemove', onWindowDrag);
            document.removeEventListener('mouseup', stopWindowDrag);
        }

        let scratchVarValue = 0;
        function runScratchScripts() {
            const cat = document.getElementById('scratch-sprite-cat');
            const bubble = document.getElementById('scratch-speech-bubble');
            const stage = document.getElementById('scratch-stage');
            const blocks = document.querySelectorAll('#scratch-blocks-container .scratch-block');
            if (!cat) return;

            // Clear any existing active runner
            if (window.scratchActiveInterval) {
                clearInterval(window.scratchActiveInterval);
            }

            const xValEl = document.getElementById('scratch-x-val');
            const yValEl = document.getElementById('scratch-y-val');
            let posX = xValEl ? (parseInt(xValEl.innerText) || 0) : 0;
            let posY = yValEl ? (parseInt(yValEl.innerText) || 0) : 0;
            let rotation = 0;
            let stepIndex = 0;

            // Track mouse position on stage
            let mouseX = 0, mouseY = 0;
            if (stage) {
                stage.onmousemove = (ev) => {
                    const rect = stage.getBoundingClientRect();
                    mouseX = ev.clientX - rect.left - rect.width / 2;
                    mouseY = ev.clientY - rect.top - rect.height / 2;
                };
            }

            // If no blocks are in workspace, do nothing
            if (blocks.length === 0) {
                showNotification('Scratch', 'No blocks in workspace! Add blocks to run.');
                return;
            }

            const interval = setInterval(() => {
                // Verify window/elements still exist to prevent null reference errors
                if (!document.getElementById('win-scratch') || !document.getElementById('scratch-sprite-cat')) {
                    clearInterval(interval);
                    window.scratchActiveInterval = null;
                    return;
                }

                if (stepIndex >= blocks.length) {
                    stepIndex = 0; // Loop through stacked blocks
                }

                const block = blocks[stepIndex];
                if (!block) {
                    stepIndex++;
                    return;
                }

                const type = block.dataset.type;
                const val = block.dataset.val;

                if (type === 'move') {
                    const steps = parseInt(val) || 10;
                    const rad = (rotation * Math.PI) / 180;
                    posX += Math.cos(rad) * steps;
                    posY += Math.sin(rad) * steps;
                } else if (type === 'turnR') {
                    const deg = parseInt(val) || 15;
                    rotation += deg;
                } else if (type === 'point') {
                    const dx = mouseX - posX;
                    const dy = mouseY - posY;
                    rotation = Math.atan2(dy, dx) * (180 / Math.PI);
                    posX += Math.cos((rotation * Math.PI) / 180) * 4;
                    posY += Math.sin((rotation * Math.PI) / 180) * 4;
                } else if (type === 'say') {
                    if (bubble) {
                        bubble.innerText = val || 'Hello!';
                        bubble.classList.remove('hidden');
                        setTimeout(() => {
                            if (bubble) bubble.classList.add('hidden');
                        }, 1000);
                    }
                } else if (type === 'sound') {
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.15);
                        osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.4);

                        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

                        osc.connect(gainNode);
                        gainNode.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.4);
                    } catch (err) {
                        console.log('Audio playback error:', err);
                    }
                    showNotification('Scratch Audio', '🔊 Meow!');
                } else if (type === 'var') {
                    scratchVarValue++;
                    const varEl = document.getElementById('scratch-var-val');
                    if (varEl) varEl.innerText = scratchVarValue;
                }

                if (cat) cat.style.transform = `translate(${posX}px, ${posY}px) rotate(${rotation}deg)`;
                const xElem = document.getElementById('scratch-x-val');
                const yElem = document.getElementById('scratch-y-val');
                if (xElem) xElem.innerText = Math.round(posX);
                if (yElem) yElem.innerText = Math.round(posY);

                stepIndex++;
            }, 150);

            window.scratchActiveInterval = interval;
            showNotification('Scratch', 'Running your stacked blocks!');
        }

            const grid = 20;

            let apple = { x: 320, y: 320 };

            function getRandomInt(min, max) {
                return Math.floor(Math.random() * (max - min)) + min;
            }

            function loop() {
                snakeGameInterval = requestAnimationFrame(loop);
                if (++count < 6) return;
                count = 0;

                ctx.clearRect(0,0,canvas.width,canvas.height);

                snake.x += snake.dx;
                snake.y += snake.dy;

                if (snake.x < 0) snake.x = canvas.width - grid;
                else if (snake.x >= canvas.width) snake.x = 0;

                if (snake.y < 0) snake.y = canvas.height - grid;
                else if (snake.y >= canvas.height) snake.y = 0;

                snake.cells.unshift({ x: snake.x, y: snake.y });
                if (snake.cells.length > snake.maxCells) snake.cells.pop();

                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(apple.x, apple.y, grid-1, grid-1);

                ctx.fillStyle = '#10b981';
                snake.cells.forEach((cell, index) => {
                    ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
                    if (cell.x === apple.x && cell.y === apple.y) {
                        snake.maxCells++;
                        score += 10;
                        document.getElementById('snake-score').innerText = score;
                        apple.x = getRandomInt(0, 18) * grid;
                        apple.y = getRandomInt(0, 18) * grid;
                    }
                    for (let i = index + 1; i < snake.cells.length; i++) {
                        if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                            snake.x = 160;
                            snake.y = 160;
                            snake.cells = [];
                            snake.maxCells = 4;
                            score = 0;
                            document.getElementById('snake-score').innerText = score;
                        }
                    }
                });
            }

            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
                else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
                else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
                else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
            });

            requestAnimationFrame(loop);
        }

        /* Paint App Runtime */
        let paintTool = 'pencil';
        let isPainting = false;
        let paintHistory = [];

        function setPaintTool(tool) {
            paintTool = tool;
            document.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('bg-sky-600', 'text-white'));
            const btn = document.getElementById(`tool-${tool}`);
            if (btn) btn.classList.add('bg-sky-600', 'text-white');
        }

        function initPaintApp() {
            const canvas = document.getElementById('paint-canvas');
            if (!canvas) return;
            canvas.width = 640;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            canvas.onmousedown = (e) => {
                isPainting = true;
                const rect = canvas.getBoundingClientRect();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            };

            canvas.onmousemove = (e) => {
                if (!isPainting) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const color = document.getElementById('paint-color').value;
                const size = document.getElementById('paint-size').value;

                if (paintTool === 'pencil' || paintTool === 'brush') {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = paintTool === 'pencil' ? 1 : size;
                    ctx.lineCap = 'round';
                    ctx.lineTo(x, y);
                    ctx.stroke();
                } else if (paintTool === 'eraser') {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = size * 2;
                    ctx.lineCap = 'round';
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            };

            canvas.onmouseup = () => { isPainting = false; };
        }

        function clearPaintCanvas() {
            const canvas = document.getElementById('paint-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function downloadPaintCanvas() {
            const canvas = document.getElementById('paint-canvas');
            const link = document.createElement('a');
            link.download = 'mspaint-artwork.png';
            link.href = canvas.toDataURL();
            link.click();
            showNotification('Saved', 'Artwork downloaded successfully');
        }

        /* Notification Toast System */
        function showNotification(title, message) {
            const area = document.getElementById('notification-area');
            const toast = document.createElement('div');
            toast.className = 'w-72 bg-slate-900/95 win-mica border border-white/10 p-4 rounded-2xl shadow-2xl text-white animate-window-open pointer-events-auto flex items-start space-x-3';
            toast.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center shrink-0"><i class="fa-solid fa-bell"></i></div>
                <div class="flex-1">
                    <h4 class="font-bold text-xs">${title}</h4>
                    <p class="text-[11px] text-slate-300 mt-0.5">${message}</p>
                </div>
            `;
            area.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
